function formatDone(done,unit){
  if(!done||done==="See doneness") return done;

}

// Find all GRILL HI items in a flat list for the planner
function getAllGrillItems(){
  var list=[];
  for(var cat in ING){
    ING[cat].forEach(function(ing){
      ing.outcomes.forEach(function(o){
        if(o.mode==="GRILL"&&(o.temp==="HI"||o.temp==="MED-HI"||o.temp==="MED")){
          var already=list.find(function(x){return x.name===ing.name;});
          if(!already){
            list.push({name:ing.name, catId:cat, emoji:(CATS.find(function(c){return c.id===cat;})||{emoji:"🍽️"}).emoji, time:ing.cook_time_mins, temp:o.temp, mode:o.mode});
          }
        }
      });
    });
  }
  return list.sort(function(a,b){return a.name.localeCompare(b.name);});
}

function calcPlan(selected){
  if(selected.length===0) return null;
  // Find the longest cooking item
  var maxTime=0;
  selected.forEach(function(s){if(s.time>maxTime)maxTime=s.time;});
  // Determine common temp (use HI if any HI, else MED-HI, else MED)
  var hasHI = selected.some(function(s){return s.temp==="HI";});
  var hasMedHI = selected.some(function(s){return s.temp==="MED-HI";});
  var commonTemp = hasHI?"HI":hasMedHI?"MED-HI":"MED";
  // Work out add times relative to start
  var plan=selected.map(function(s){
    var addAfter=maxTime-s.time;
    return {name:s.name, emoji:s.emoji, addAfter:addAfter, time:s.time};
  }).sort(function(a,b){return a.addAfter-b.addAfter;});
  return {totalTime:maxTime, temp:commonTemp, mode:"GRILL", plan:plan};
}

function getSeason(){
  var m = new Date().getMonth(); // 0-11
  if(m>=2&&m<=4) return 'spring';
  if(m>=5&&m<=7) return 'summer';
  if(m>=8&&m<=10) return 'autumn';
  return 'winter';
}
function getSeasonalItems(ING_data){
  var season = getSeason();
  var items  = SEASONAL[season]||[];
  // Filter to only items that exist in current data
  var result = [];
  items.forEach(function(si){
    for(var cat in ING_data){
      var found = ING_data[cat].find(function(i){return i.name===si.name;});
      if(found){result.push({catId:cat,item:found,emoji:si.emoji,tip:si.tip});break;}
    }
  });
  return result;
}

// Share functionality
function buildShareText(item, outcome, unit) {
  var oc = outcome || (item.outcomes && item.outcomes[0]) || item;
  var mode = oc.mode || item.fn || "";
  var temp = oc.temp || item.temp || "";
  var time = oc.time || item.time || "";
  var done = oc.done || "";
  var label = oc.label ? " ("+oc.label+")" : "";
  return "Ninja Cook Guide: "+item.name+label+"\n"+
         "Function: "+mode+"\n"+
         "Temp: "+temp+"\n"+
         "Time: "+time+"\n"+
         (done && done!=="See doneness" ? "Done when: "+done+"\n" : "")+
         "\ndirtyduffers.github.io/ninja-woodfire-app";
}

function shareItem(item, outcome, unit) {
  var text = buildShareText(item, outcome, unit);
  if(navigator.share){
    navigator.share({title:"Ninja Cook Guide — "+item.name, text:text}).catch(function(){});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){
      alert("Copied to clipboard!");
    }).catch(function(){});
  } else {
    // Fallback
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert("Copied to clipboard!");
  }
}

// Get suggested sides for an ingredient
function getSides(ingName, ING_data, CATS_data){
  var sideNames=SIDES[ingName]||[];
  if(sideNames.length===0) return [];
  var results=[];
  sideNames.forEach(function(sideName){
    // Find this ingredient in the data
    for(var cat in ING_data){
      var found=ING_data[cat].find(function(i){return i&&i.name===sideName;});
      if(found){
        var catObj=CATS_data.find(function(c){return c.id===cat;});
        results.push({catId:cat,emoji:catObj?catObj.emoji:"🍽️",item:found});
        break;
      }
    }
  });
  return results;
}

// Parse a time string like "10-15 mins" or "45-60 mins" and return [min, max] in minutes
function parseTimeMins(timeStr){
  if(!timeStr) return [10,15];
  var rng = timeStr.match(/(\d+)[-–](\d+)\s*mins?/);
  if(rng) return [parseInt(rng[1]), parseInt(rng[2])];
  var single = timeStr.match(/(\d+)\s*mins?/);
  if(single){var v=parseInt(single[1]);return [v,v];}
  var hrs = timeStr.match(/(\d+)-(\d+)\s*h/);
  if(hrs) return [parseInt(hrs[1])*60, parseInt(hrs[2])*60];
  return [10,15];
}

// Build frozen time string: add 50% to min and max
function frozenTimeStr(timeStr){
  var parsed = parseTimeMins(timeStr);
  var newMin = Math.round(parsed[0]*1.5);
  var newMax = Math.round(parsed[1]*1.5);
  if(newMin===newMax) return newMin+" mins (from frozen)";
  return newMin+"-"+newMax+" mins (from frozen)";
}

// Portion time adjustment: base time * multiplier based on extra weight
// Rule: each doubling of weight adds ~15-20% cook time (not linear - heat penetration)
function portionTimeStr(timeStr, portions, servingWeightG){
  if(portions<=1) return timeStr;
  var parsed = parseTimeMins(timeStr);
  // For grill items, more portions mostly means cooking in batches not longer times
  // For roast/smoker, more weight does increase time
  // Use a moderate scaling: +5% per additional portion up to max +40%
  var scale = Math.min(1 + (portions-1)*0.05, 1.4);
  var newMin = Math.round(parsed[0]*scale);
  var newMax = Math.round(parsed[1]*scale);
  if(portions<=2) return timeStr; // 1-2 portions, no change needed
  if(newMin===newMax) return newMin+" mins";
  return newMin+"-"+newMax+" mins";
}

// Convert grams to oz
function gToOz(g){return Math.round(g*0.03527*10)/10;}
function ozToG(oz){return Math.round(oz/0.03527);}

function getNutrition(ingName, weightG){
  var n = NUTRITION[ingName];
  if(!n) return null;
  var factor = weightG / 100;
  return {
    kcal: Math.round(n.kcal * factor),
    pro:  Math.round(n.pro  * factor * 10) / 10,
    fat:  Math.round(n.fat  * factor * 10) / 10,
    carb: Math.round(n.carb * factor * 10) / 10,
    note: n.note,
    per100: n
  };
}

// ── MACRO CHART HELPER ────────────────────────────────────────────────────────
// Returns SVG path data for a donut chart given values
function macroDonut(pro, fat, carb){
  var total = pro + fat + carb;
  if(total <= 0) return null;
  var pPro  = pro  / total;
  var pFat  = fat  / total;
  var pCarb = carb / total;

  function describeArc(cx, cy, r, startAngle, endAngle){
    var s = startAngle * Math.PI / 180;
    var e = endAngle   * Math.PI / 180;
    var x1 = cx + r * Math.cos(s);
    var y1 = cy + r * Math.sin(s);
    var x2 = cx + r * Math.cos(e);
    var y2 = cy + r * Math.sin(e);
    var large = endAngle - startAngle > 180 ? 1 : 0;
    return "M"+x1+","+y1+" A"+r+","+r+" 0 "+large+",1 "+x2+","+y2;
  }

  var start = -90;
  var proEnd  = start + pPro  * 360;
  var fatEnd  = proEnd + pFat  * 360;
  var carbEnd = fatEnd + pCarb * 360;

  return {
    pro:  {path: describeArc(50,50,38,start,proEnd),  pct: Math.round(pPro*100)},
    fat:  {path: describeArc(50,50,38,proEnd,fatEnd),  pct: Math.round(pFat*100)},
    carb: {path: describeArc(50,50,38,fatEnd,carbEnd), pct: Math.round(pCarb*100)},
  };
}

// ── MEAL NUTRITION CALCULATOR ─────────────────────────────────────────────────
function getMealNutrition(selectedItems, portionCount, SERVING_WEIGHTS_data, CAT_WEIGHTS_data){
  var totals = {kcal:0, pro:0, fat:0, carb:0};
  var breakdown = [];
  selectedItems.forEach(function(sel){
    var sw = SERVING_WEIGHTS_data[sel.name] || (CAT_WEIGHTS_data[sel.catId] || 150);
    var n  = getNutrition(sel.name, sw * portionCount);
    if(n){
      totals.kcal += n.kcal;
      totals.pro  += n.pro;
      totals.fat  += n.fat;
      totals.carb += n.carb;
      breakdown.push({name:sel.name, emoji:sel.emoji||"🍽️", kcal:n.kcal, pro:n.pro, fat:n.fat, carb:n.carb});
    }
  });
  totals.pro  = Math.round(totals.pro  * 10) / 10;
  totals.fat  = Math.round(totals.fat  * 10) / 10;
  totals.carb = Math.round(totals.carb * 10) / 10;
  return {totals:totals, breakdown:breakdown};
}

function getGI(ingName, carbsPer100g, weightG){
  var d = GI_DATA[ingName];
  if(!d || !carbsPer100g || carbsPer100g < 2) return null;
  var carbsInServing = (carbsPer100g * weightG) / 100;
  var gl = Math.round((d.gi * carbsInServing) / 100);
  var glCat = gl <= 10 ? "Low GL" : gl <= 19 ? "Medium GL" : "High GL";
  var glCol = gl <= 10 ? "low" : gl <= 19 ? "medium" : "high";
  return {
    gi: d.gi,
    gl: gl,
    fibre: d.fibre,
    note: d.note,
    giCat: d.category,
    glCat: glCat,
    glCol: glCol,
    carbsInServing: Math.round(carbsInServing * 10) / 10,
  };
}

  if(t.vg)  suitable.push({label:"Vegan",      col:"#116633",emoji:"🌱"});
  if(t.v && !t.vg) suitable.push({label:"Vegetarian",col:"#226633",emoji:"🥦"});
  // Add from dietary notes
  var dn = DIETARY_NOTES[ingName];
  if(dn && dn.suitableFor){
    dn.suitableFor.forEach(function(s){
      // Don't duplicate

function scaleMarinadeQty(qty, portions){
  // Standard marinade recipes are for 4 portions - scale up/down
  var factor = (portions || 2) / 4;
  if(factor === 1) return qty;
  // Parse and scale numeric values in strings like "2 tbsp", "3 garlic cloves"
  return qty.replace(/(\d+(?:\.\d+)?)/g, function(match, num){
    var n = parseFloat(num);
    var scaled = n * factor;
    // Round to sensible precision
    if(scaled < 1) return Math.round(scaled * 4) / 4 + "";   // quarter precision
    if(scaled < 5) return Math.round(scaled * 2) / 2 + "";   // half precision
    return Math.round(scaled) + "";
  });
}

// Returns weight presets for an item: [{label, g, stdG}]
// Raw gram presets per cut type (unit-agnostic)
function getWeightPresets(name) {
  var burgers = ["Beef burgers","Smash burgers","Chicken burgers","Turkey burgers"];
  var thick   = ["Tomahawk steak","Cote de boeuf","Chateaubriand","T-bone steak","Porterhouse steak"];
  var isBurger = burgers.indexOf(name) >= 0;
  var isThick  = thick.indexOf(name) >= 0;
  if (isBurger) return {std:150, presets:[85,113,142,170,198,227]};
  if (isThick)  return {std:500, presets:[340,454,567,680,794,907]};
  return {std:200, presets:[113,142,170,198,227,255,283,340]};
}

// Format a gram value in the chosen unit with clean labels
function fmtWeight(g, unit) {
  if (unit === "oz") {
    if (g === 57)  return "2oz";
    if (g === 85)  return "3oz";
    if (g === 113) return "4oz";
    if (g === 142) return "5oz";
    if (g === 170) return "6oz";
    if (g === 198) return "7oz";
    if (g === 227) return "8oz";
    if (g === 255) return "9oz";
    if (g === 283) return "10oz";
    if (g === 312) return "11oz";
    if (g === 340) return "12oz";
    if (g === 369) return "13oz";
    if (g === 397) return "14oz";
    if (g === 425) return "15oz";
    if (g === 454) return "16oz";
    if (g === 567) return "20oz";
    if (g === 680) return "24oz";
    if (g === 794) return "28oz";
    if (g === 907) return "32oz";
    return Math.round(g / 28.3495) + "oz";
  }
  if (unit === "lb") {
    if (g === 57)  return "⅛lb";
    if (g === 85)  return "3oz";
    if (g === 113) return "¼lb";
    if (g === 142) return "5oz";
    if (g === 170) return "⅜lb";
    if (g === 198) return "7oz";
    if (g === 227) return "½lb";
    if (g === 255) return "9oz";
    if (g === 283) return "⅝lb";
    if (g === 312) return "11oz";
    if (g === 340) return "¾lb";
    if (g === 369) return "13oz";
    if (g === 397) return "⅞lb";
    if (g === 425) return "15oz";
    if (g === 454) return "1lb";
    if (g === 567) return "1¼lb";
    if (g === 680) return "1½lb";
    if (g === 794) return "1¾lb";
    if (g === 907) return "2lb";
    var lb = g / 453.592;
    return lb.toFixed(1) + "lb";
  }
  return g + "g";
}

// Map gram presets to the chosen unit with friendly values
function unitPresets(name, unit) {
  var burgers = ["Beef burgers","Smash burgers","Chicken burgers","Turkey burgers"];
  var thick   = ["Tomahawk steak","Cote de boeuf","Chateaubriand","T-bone steak","Porterhouse steak"];
  var isBurger = burgers.indexOf(name) >= 0;
  var isThick  = thick.indexOf(name) >= 0;
  if (unit === "oz") {
    if (isBurger) return {std:142, presets:[85,113,142,170,198,227]};    // 3,4,5,6,7,8oz
    if (isThick)  return {std:454, presets:[283,340,397,454,567,680,794,907]}; // 10,12,14,16,20,24,28,32oz
    return         {std:170, presets:[113,142,170,198,227,255,283,340]}; // 4,5,6,7,8,9,10,12oz
  }
  if (unit === "lb") {
    if (isBurger) return {std:142, presets:[113,142,170,227,340,454]};   // ¼,5oz,⅜,½,¾,1lb
    if (isThick)  return {std:454, presets:[340,454,567,680,794,907]};   // ¾,1,1¼,1½,1¾,2lb
    return         {std:227, presets:[113,170,227,283,340,454,567,680]}; // ¼,⅜,½,⅝,¾,1,1¼,1½lb
  }
  // grams
  if (isBurger) return {std:150, presets:[85,113,142,170,198,227]};      // 85-227g
  if (isThick)  return {std:500, presets:[340,454,567,680,794,907]};     // 340-900g
  return         {std:200, presets:[113,142,170,198,227,255,283,340]};   // 113-340g
}

// Scale cook time by weight using sqrt scaling (heavier = longer but not linearly)
function weightAdjustedTime(timeStr, weightG, stdG) {
  if (!timeStr || timeStr === "See doneness") return timeStr;
  var parsed = parseTimeMins(timeStr);
  var scale = Math.sqrt(weightG / stdG);
  var minT = Math.round(parsed[0] * scale);
  var maxT = Math.round(parsed[1] * scale);
  if (minT === maxT) return minT + " mins";
  return minT + "-" + maxT + " mins";
}
